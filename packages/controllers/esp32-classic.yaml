# Custom wiring on a classic ESP32 (ESP32-WROOM-32).
#
# No `board:` preset is used here -- the pin mapping is hand-wired, so every
# required pin is listed explicitly.
#
# Pin notes (classic ESP32):
#   * GPIO2 / GPIO12 / GPIO15 are strapping pins, sampled at reset:
#     GPIO12 must be LOW, GPIO15 must be HIGH, and GPIO2 must not be pulled
#     high (that selects the ROM download mode). They are driven as HUB75
#     data/address lines, so keep the panel side from back-feeding them --
#     a 1k series resistor on each of these three lines is a good idea.
#   * GPIO32 / GPIO33 are only broken out on modules without octal PSRAM
#     (WROOM-32 yes, WROVER no -- WROVER uses GPIO32-37 for its PSRAM).
#   * GPIO6-11 (SPI flash), GPIO0/1/3 (UART) and the input-only GPIO34/35/36/39
#     are deliberately untouched.
esp32:
  board: esp32dev
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
      enable_idf_experimental_features: true

display:
  - platform: hub75
    id: matrix

    # --- RGB data lines (top shift register) ---
    r1_pin: GPIO17
    g1_pin:
      number: GPIO2
      ignore_strapping_warning: true
    b1_pin: GPIO16

    # --- RGB data lines (bottom shift register) ---
    r2_pin: GPIO4
    g2_pin:
      number: GPIO15
      ignore_strapping_warning: true
    b2_pin:
      number: GPIO12
      ignore_strapping_warning: true

    # --- Row address lines ---
    a_pin: GPIO26
    b_pin: GPIO13
    c_pin: GPIO14
    d_pin: GPIO27
    e_pin: GPIO22

    # --- Control lines ---
    lat_pin: GPIO33
    oe_pin: GPIO32
    clk_pin: GPIO25

    panel_width: ${panel_width}
    panel_height: ${panel_height}
    layout: ${layout}
    layout_rows: ${layout_rows}
    layout_cols: ${layout_cols}
    scan_wiring: ${scan_wiring}

    clock_phase: false
    latch_blanking: 1
    # 20MHz is what the ESP32-S3 (parlio) path uses, but the classic ESP32's I2S
    # peripheral maxes out at 10MHz and the driver silently halves it anyway.
    # Ask for 10MHz directly so the timing constants match the real clock.
    clock_speed: 10MHz

    bit_depth: 8

    # for LVGL
    double_buffer: false
    auto_clear_enabled: false
    update_interval: never

lvgl:
  byte_order: little_endian
  buffer_size: 100%
  displays:
    - matrix
